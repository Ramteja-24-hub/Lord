<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Lord Sri Vishnu</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>🕉️ Kaliyuga Daivam</h1>
            <p class="mantra">✨ Om Namo Bhagavate Vasudevaya ✨</p>
        </header>
        <section class="main-image">
            <img src="vishnu.jpg" alt="Lord Vishnu">
            <p class="divine-text">The Preserver of the Universe 🌍💫</p>
        </section>
        <section class="buttons">
            <button onclick="showInfo('matsya')">🐟 Matsya</button>
            <button onclick="showInfo('kurma')">🐢 Kurma</button>
            <button onclick="showInfo('varaha')">🐗 Varaha</button>
            <button onclick="showInfo('narasimha')">🦁 Narasimha</button>
            <button onclick="showInfo('vamana')">🧒 Vamana</button>
            <button onclick="showInfo('parashurama')">🪓 Parashurama</button>
            <button onclick="showInfo('rama')">🏹 Rama</button>
            <button onclick="showInfo('krishna')">🪈 Krishna</button>
            <button onclick="showInfo('buddha')">☸️ Buddha</button>
            <button onclick="showInfo('kalki')">⚔️ Kalki</button>
            <button onclick="showInfo('venkateswara')">🛕 Venkateswara</button>
        </section>
        <section class="info-box" id="infoBox">
            <p>🙏 Click on any Avatar to know divine information.</p>
        </section>
        <footer>
            <p>🕉️ Designed with Devotion | By Ram 🙏</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
